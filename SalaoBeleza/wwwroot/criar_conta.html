
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - Belleza</title>

    <link rel="stylesheet" href="criar_conta.css">
</head>

<body>

    <main class="cadastro-card">

        <div class="logo-area">

            <img
                src="imagens/logo_belleza_login.png"
                alt="Logo Belleza"
                class="logo"
            >

        </div>


        <p class="texto-cadastro">
            Preencha os dados abaixo para criar sua conta.
        </p>


        <form id="formCadastro">

           

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


           

            <div class="campo">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

            </div>


           

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


           

            <div class="campo">

                <label for="confirmar">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>


           

            <label class="lembrar">

                <input
                    type="checkbox"
                    name="lembrar"
                >

                Lembrar-me

            </label>


           

            <button
                type="submit"
                class="btn-criar">

                Criar conta

            </button>


            <div class="ou">

                <span>ou</span>

            </div>


         

            <p class="login">

                Já tem uma conta?

                <a href="login_cliente.html">
                    Fazer login
                </a>

            </p>

        </form>

    </main>


    <script>

        document
            .getElementById("formCadastro")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


               

                const nome =
                    document.getElementById("nome").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const telefone =
                    document.getElementById("telefone").value.trim();

                const senha =
                    document.getElementById("senha").value;

                const confirmar =
                    document.getElementById("confirmar").value;


                

                if (senha !== confirmar) {

                    alert("As senhas não são iguais.");

                    return;
                }


                

                const dados = {

                    nome: nome,
                    email: email,
                    telefone: telefone,
                    senha: senha

                };


                try {

                    const resposta = await fetch(
                        "/api/clientes",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(dados)
                        }
                    );


                    

                    if (resposta.ok) {

                        alert("Conta criada com sucesso!");

                        window.location.href =
                            "login_cliente.html";

                        return;
                    }


                    

                    let mensagemErro =
                        "Não foi possível criar a conta.";

                    try {

                        const erro =
                            await resposta.json();

                        if (erro.title) {
                            mensagemErro = erro.title;
                        }

                        if (erro.message) {
                            mensagemErro = erro.message;
                        }

                    } catch (e) {

                
                    }


                    alert(mensagemErro);

                    console.log(
                        "Status da API:",
                        resposta.status
                    );

                } catch (erro) {

                    console.error(erro);

                    alert(
                        "Erro ao conectar com o servidor."
                    );

                }

            });

    </script>

</body>

</html>
