<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha - Belleza</title>

    <link rel="stylesheet" href="recuperar_senha.css">
</head>

<body>

    <main class="recuperar-card">

        <div class="logo-area">

            <img
                src="imagens/logo_belleza.png"
                alt="Logo Belleza"
                class="logo"
            >

        </div>


        <h2>Recuperar</h2>


        <p class="texto-recuperar">
            Preencha os dados abaixo para alterar sua senha
        </p>


        <form action="#" method="post">

            <div class="campo">

                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="campo">

                <label for="nova-senha">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="nova-senha"
                    name="nova-senha"
                    placeholder="Nova senha"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <div class="campo">

                <label for="confirmar-senha">
                    Confirmar senha:
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-salvar">

                Salvar senha

            </button>


            <a
                href="login_cliente.html"
                class="voltar">

                Voltar

            </a>

        </form>

    </main>

</body>

</html>
