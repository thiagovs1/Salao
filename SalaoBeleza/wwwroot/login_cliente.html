<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Belleza</title>

    <link rel="stylesheet" href="login_cliente.css">
</head>

<body>

    <main class="login-card">

        <div class="logo-area">

            <img
                src="imagens/logo_belleza.png"
                alt="Logo Belleza"
                class="logo"
            >

        </div>

        <p class="texto-login">
            Faça login para continuar
        </p>

        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <div class="esqueci">

                <a href="recuperar_senha.html">
                    Esqueci minha senha
                </a>

            </div>

            <button
                type="submit"
                class="btn-entrar">

                Entrar

            </button>

            <div class="ou">

                <span>ou</span>

            </div>

            <a
                href="criar_conta.html"
                class="btn-criar">

                Criar conta

            </a>

        </form>

        <p class="frase">
            Realce sua beleza. Revele sua essência.
        </p>

    </main>

    <script>

        document
            .getElementById("formLogin")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email = document
                    .getElementById("email")
                    .value
                    .trim();

                const senha = document
                    .getElementById("senha")
                    .value;

                if (!email || !senha) {

                    alert("Preencha o e-mail e a senha.");

                    return;
                }

                try {

                    const resposta = await fetch("/api/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            senha: senha
                        })

                    });

                    const texto = await resposta.text();

                    console.log("STATUS:", resposta.status);
                    console.log("RESPOSTA:", texto);

                    if (resposta.ok) {

                        alert("Login realizado com sucesso!");

                        window.location.href =
                            "tela_inicial.html";

                        return;
                    }

                    if (resposta.status === 401) {

                        alert("E-mail ou senha inválidos.");

                        return;
                    }

                    alert(
                        "ERRO " +
                        resposta.status +
                        ":\n\n" +
                        texto
                    );

                }
                catch (erro) {

                    console.error(erro);

                    alert(
                        "Erro ao conectar com o servidor."
                    );

                }

            });

    </script>

</body>

</html>
