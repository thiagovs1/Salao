
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - Belleza</title>

    <link rel="stylesheet" href="/css/criar_conta.css?v=3">
</head>

<body>

    <main class="cadastro-card">

        <div class="logo-area">
            <img
                src="/imagens/logo_belleza_login.png"
                alt="Logo Belleza"
                class="logo"
            >
        </div>

        <p class="texto-cadastro">
            Preencha os dados abaixo para criar sua conta.
        </p>

        <form id="formCadastro">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <!-- SENHA -->

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="senha-container">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                    <button
                        type="button"
                        class="btn-olho"
                        id="btnOlhoSenha"
                        aria-label="Mostrar senha"
                        title="Mostrar senha"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>

                </div>
            </div>

            <!-- CONFIRMAR SENHA -->

            <div class="campo">
                <label for="confirmar">Confirmar senha</label>

                <div class="senha-container">

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Confirme sua senha"
                        required
                    >

                    <button
                        type="button"
                        class="btn-olho"
                        id="btnOlhoConfirmar"
                        aria-label="Mostrar senha"
                        title="Mostrar senha"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>

                </div>
            </div>

            <!-- LEMBRAR-ME -->

            <label class="lembrar">
                <input
                    type="checkbox"
                    name="lembrar"
                >

                Lembrar-me
            </label>

            <!-- MENSAGEM -->

            <div id="mensagemCadastro"></div>

            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn-criar"
                id="btnCriar"
            >
                Criar conta
            </button>

            <div class="ou">
                <span>ou</span>
            </div>

            <p class="login">
                Já tem uma conta?

                <a href="/html/login_cliente.html">
                    Fazer login
                </a>
            </p>

        </form>

    </main>

    <script>

        // ELEMENTOS

        const formCadastro = document.getElementById("formCadastro");

        const mensagemCadastro = document.getElementById("mensagemCadastro");

        const btnCriar = document.getElementById("btnCriar");

        const campoSenha = document.getElementById("senha");

        const campoConfirmar = document.getElementById("confirmar");

        const btnOlhoSenha = document.getElementById("btnOlhoSenha");

        const btnOlhoConfirmar = document.getElementById("btnOlhoConfirmar");


        // SVG DOS OLHOS

        const olhoAberto = `
            <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        `;

        const olhoFechado = `
            <svg viewBox="0 0 24 24">
                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.8 15.8 0 0 1-3 3.8"/>
                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
            </svg>
        `;


        // MOSTRAR E ESCONDER SENHA

        function alternarSenha(campo, botao) {

            const mostrar = campo.type === "password";

            campo.type = mostrar ? "text" : "password";

            botao.innerHTML = mostrar ? olhoFechado : olhoAberto;

            botao.setAttribute(
                "aria-label",
                mostrar ? "Esconder senha" : "Mostrar senha"
            );

            botao.title = mostrar ? "Esconder senha" : "Mostrar senha";
        }


        btnOlhoSenha.addEventListener("click", function () {

            alternarSenha(campoSenha, btnOlhoSenha);

        });


        btnOlhoConfirmar.addEventListener("click", function () {

            alternarSenha(campoConfirmar, btnOlhoConfirmar);

        });


        // CADASTRO

        formCadastro.addEventListener("submit", async function (event) {

            event.preventDefault();

            if (btnCriar.disabled) return;

            mensagemCadastro.textContent = "";
            mensagemCadastro.style.color = "";

            const nome = document.getElementById("nome").value.trim();

            const email = document.getElementById("email").value.trim();

            const telefone = document.getElementById("telefone").value.trim();

            const senha = campoSenha.value;

            const confirmar = campoConfirmar.value;


            // VALIDAÇÃO DOS CAMPOS

            if (
                nome === "" ||
                email === "" ||
                telefone === "" ||
                senha === "" ||
                confirmar === ""
            ) {

                mensagemCadastro.textContent = "Preencha todos os campos.";

                mensagemCadastro.style.color = "#c0392b";

                return;
            }


            // BLOQUEIO DE E-MAIL ADMINISTRATIVO

            if (email.toLowerCase().endsWith("@adm.belleza.com")) {

                mensagemCadastro.textContent =
                    "Este domínio de e-mail é reservado aos administradores.";

                mensagemCadastro.style.color = "#c0392b";

                return;
            }


            // CONFIRMAÇÃO DE SENHA

            if (senha !== confirmar) {

                mensagemCadastro.textContent = "As senhas não coincidem.";

                mensagemCadastro.style.color = "#c0392b";

                return;
            }


            // CARREGAMENTO

            btnCriar.disabled = true;

            btnCriar.innerHTML = `
                <span class="spinner"></span>
                <span>Criando conta...</span>
            `;


            try {

                const resposta = await fetch("/api/Usuarios", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({

                        nome: nome,

                        email: email,

                        telefone: telefone,

                        senha: senha

                    })

                });


                const textoResposta = await resposta.text();

                let resultado;


                try {

                    resultado = textoResposta
                        ? JSON.parse(textoResposta)
                        : {};

                } catch {

                    console.error(
                        "Resposta inválida do servidor:",
                        textoResposta
                    );

                    mensagemCadastro.textContent =
                        "O servidor apresentou um erro ao criar a conta.";

                    mensagemCadastro.style.color = "#c0392b";

                    return;
                }


                // ERRO DA API

                if (!resposta.ok) {

                    mensagemCadastro.textContent =
                        resultado.message ||
                        resultado.mensagem ||
                        resultado.title ||
                        "Não foi possível criar a conta.";

                    mensagemCadastro.style.color = "#c0392b";

                    return;
                }


                // SUCESSO

                mensagemCadastro.textContent =
                    "Conta criada com sucesso!";

                mensagemCadastro.style.color = "#2e8b57";

                btnCriar.innerHTML = `
                    <span>Conta criada!</span>
                    <span>✓</span>
                `;

                formCadastro.reset();


                // REDIRECIONAMENTO

                setTimeout(function () {

                    window.location.href = "/html/login_cliente.html";

                }, 1500);


            } catch (erro) {

                console.error("Erro ao criar conta:", erro);

                mensagemCadastro.textContent =
                    "Erro ao criar conta. Tente novamente mais tarde.";

                mensagemCadastro.style.color = "#c0392b";


            } finally {

                if (!mensagemCadastro.textContent.includes("sucesso")) {

                    btnCriar.disabled = false;

                    btnCriar.innerHTML = "Criar conta";

                }

            }

        });

    </script>

</body>

</html>
