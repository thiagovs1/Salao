<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Criar Conta - Belleza</title>

<link rel="stylesheet" href="/css/criar_conta.css?v=2">


</head>

<body>


<main class="cadastro-card">

    <div class="logo-area">

        <img
            src="../imagens/logo_belleza_login.png"
            alt="Logo Belleza"
            class="logo"
        >

    </div>


    <p class="texto-cadastro">
        Preencha os dados abaixo para criar sua conta.
    </p>


    <form id="formCadastro">


        <div class="campo">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

        </div>


        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

        </div>


        <div class="campo">

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required
            >

        </div>


        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

        </div>


        <div class="campo">

            <label for="confirmar">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar"
                name="confirmar"
                placeholder="Confirme sua senha"
                required
            >

        </div>


        <label class="lembrar">

            <input
                type="checkbox"
                name="lembrar"
            >

            Lembrar-me

        </label>


        <div
            id="mensagemCadastro"
            style="
                margin-top: 10px;
                margin-bottom: 10px;
                text-align: center;
                font-size: 14px;
                min-height: 20px;
            ">
        </div>


        <button
            type="submit"
            class="btn-criar">

            Criar conta

        </button>


        <div class="ou">

            <span>ou</span>

        </div>


        <p class="login">

            Já tem uma conta?

            <a href="../html/login_cliente.html">
                Fazer login
            </a>

        </p>

    </form>

</main>


<script>

    const formCadastro = document.getElementById("formCadastro");
    const mensagemCadastro = document.getElementById("mensagemCadastro");


    formCadastro.addEventListener("submit", async function (event) {

        event.preventDefault();


        mensagemCadastro.textContent = "";
        mensagemCadastro.style.color = "";


        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const telefone = document.getElementById("telefone").value.trim();
        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar").value;


        // Verifica se algum campo está vazio.

        if (
            nome === "" ||
            email === "" ||
            telefone === "" ||
            senha === "" ||
            confirmar === ""
        ) {

            mensagemCadastro.textContent =
                "Preencha todos os campos.";

            mensagemCadastro.style.color = "#c0392b";

            return;
        }


        // Verifica se as senhas são iguais.

        if (senha !== confirmar) {

            mensagemCadastro.textContent =
                "As senhas não coincidem.";

            mensagemCadastro.style.color = "#c0392b";

            return;
        }


        try {

            // Envia os dados para a API.

            const resposta = await fetch(
                "http://localhost:5000/api/Usuarios",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        nome: nome,
                        email: email,
                        telefone: telefone,
                        senha: senha

                    })
                }
            );


            // Tenta pegar a resposta da API.

            const resultado = await resposta.json();


            // Se a API retornar erro.

            if (!resposta.ok) {

                mensagemCadastro.textContent =
                    resultado.message ||
                    resultado.title ||
                    "Não foi possível criar a conta.";

                mensagemCadastro.style.color = "#c0392b";

                return;
            }


            // Cadastro realizado.

            mensagemCadastro.textContent =
                "Conta criada com sucesso!";

            mensagemCadastro.style.color = "#2e8b57";


            // Limpa o formulário.

            formCadastro.reset();


            // Aguarda 1,5 segundo e vai para o login.

            setTimeout(function () {

                window.location.href =
                    "../html/login_cliente.html";

            }, 1500);

        }


        catch (erro) {

            console.error(erro);

            mensagemCadastro.textContent =
                "Telefone ou email já cadastrados.";

            mensagemCadastro.style.color = "#c0392b";

        }

    });

</script>


</body>

</html>
