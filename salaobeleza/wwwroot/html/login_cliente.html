
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Belleza</title>
    <link rel="stylesheet" href="/css/login_cliente.css?v=3">

    <style>
        .senha-container {
            position: relative;
            width: 100%;
        }

        .senha-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 48px;
        }

        .btn-olho {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 5px;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-olho svg {
            width: 25px;
            height: 25px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-entrar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-entrar:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: girar 0.7s linear infinite;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo-area">
            <img src="/imagens/logo_belleza_login.png" alt="Logo Belleza" class="logo">
        </div>

        <p class="texto-login">Faça login para continuar</p>

        <form id="formLogin">

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="senha-container">
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required>

                    <button
                        type="button"
                        class="btn-olho"
                        id="btnOlho"
                        aria-label="Mostrar senha"
                        title="Mostrar senha">

                        <svg id="iconeOlho" viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="esqueci">
                <a href="recuperar_senha.html">Esqueci minha senha</a>
            </div>

            <div
                id="mensagemLogin"
                style="margin-top:10px;margin-bottom:10px;text-align:center;font-size:14px;min-height:20px;">
            </div>

            <button type="submit" class="btn-entrar" id="btnEntrar">
                Entrar
            </button>

            <div class="ou"><span>ou</span></div>

            <a href="criar_conta.html" class="btn-criar">Criar conta</a>

        </form>

        <p class="frase">Realce sua beleza. Revele sua essência.</p>

    </main>

    <script>
        const formLogin = document.getElementById("formLogin");
        const mensagemLogin = document.getElementById("mensagemLogin");
        const btnEntrar = document.getElementById("btnEntrar");
        const campoSenha = document.getElementById("senha");
        const btnOlho = document.getElementById("btnOlho");
        const iconeOlho = document.getElementById("iconeOlho");

        // Mostrar e esconder senha
        btnOlho.addEventListener("click", function () {

            const mostrar = campoSenha.type === "password";

            campoSenha.type = mostrar ? "text" : "password";

            if (mostrar) {
                iconeOlho.innerHTML = `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.8 15.8 0 0 1-3 3.8"/>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                `;
                btnOlho.setAttribute("aria-label", "Esconder senha");
                btnOlho.title = "Esconder senha";
            } else {
                iconeOlho.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
                btnOlho.setAttribute("aria-label", "Mostrar senha");
                btnOlho.title = "Mostrar senha";
            }
        });

        // Login
        formLogin.addEventListener("submit", async function (event) {

            event.preventDefault();

            if (btnEntrar.disabled) return;

            mensagemLogin.textContent = "";

            const email = document.getElementById("email").value.trim();
            const senha = campoSenha.value;

            if (!email || !senha) {
                mensagemLogin.textContent = "Preencha o e-mail e a senha.";
                mensagemLogin.style.color = "#c0392b";
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.innerHTML = '<span class="spinner"></span><span>Entrando...</span>';

            try {

                const resposta = await fetch("/api/Usuarios/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                });

                const texto = await resposta.text();

                let resultado;

                try {
                    resultado = texto ? JSON.parse(texto) : {};
                } catch {
                    throw new Error("Resposta inválida do servidor.");
                }

                if (!resposta.ok) {
                    mensagemLogin.textContent =
                        resultado.mensagem || "E-mail ou senha incorretos.";

                    mensagemLogin.style.color = "#c0392b";
                    return;
                }

                mensagemLogin.textContent = "Login realizado com sucesso!";
                mensagemLogin.style.color = "#27ae60";

                btnEntrar.innerHTML = "Login realizado! ✓";

                const destino = resultado.redirecionamento;

                setTimeout(function () {

                    if (
                        destino &&
                        destino.startsWith("/") &&
                        !destino.startsWith("//")
                    ) {
                        window.location.replace(destino);
                        return;
                    }

                    if (resultado.tipoUsuario === "Administrador") {
                        window.location.replace(
                            "/administrador/html/Painel_administrador.html"
                        );
                    } else if (resultado.tipoUsuario === "Funcionario") {
                        window.location.replace(
                            "/funcionarios/html/painel_profissional.html"
                        );
                    } else {
                        window.location.replace("/html/tela_inicial.html");
                    }

                }, 700);

            } catch (erro) {

                console.error("Erro no login:", erro);

                mensagemLogin.textContent =
                    "Erro ao realizar login. Tente novamente.";

                mensagemLogin.style.color = "#c0392b";

            } finally {

                if (!mensagemLogin.textContent.includes("sucesso")) {
                    btnEntrar.disabled = false;
                    btnEntrar.innerHTML = "Entrar";
                }
            }
        });
    </script>

</body>
</html>
